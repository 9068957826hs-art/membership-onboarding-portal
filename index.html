<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemAny</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans flex flex-col antialiased">

    <!-- HEADER BANNER -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex flex-col lg:flex-row items-center justify-between gap-4 shadow-sm sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md shadow-indigo-100">
                <i class="fa-solid fa-shield-halved text-xl"></i>
            </div>
            <div>
                <h1 class="text-base font-bold text-gray-900 tracking-tight">Onboarding Command Dashboard</h1>
                <p class="text-xs font-medium text-gray-400">Production Control Workspace</p>
            </div>
        </div>

        <!-- ROLE NAVIGATION BAR -->
        <div class="flex flex-wrap items-center gap-1.5 bg-gray-100 p-1 rounded-xl border border-gray-200/60" id="role-bar">
            <button onclick="switchRole('Stakeholder')" id="btn-Stakeholder" class="role-btn flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-white text-indigo-700 shadow-sm border border-gray-200/50">
                <i class="fa-solid fa-eye"></i><span>Stakeholder (View Only)</span>
            </button>
            <button onclick="verifyAndSwitch('QA Specialist')" id="btn-QA" class="role-btn flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold text-gray-500 hover:text-gray-900 hover:bg-gray-200/60">
                <i class="fa-solid fa-database"></i><span>QA Specialist</span> <i class="fa-solid fa-lock text-[10px] opacity-40 ml-1"></i>
            </button>
            <button onclick="verifyAndSwitch('UI Designer')" id="btn-Designer" class="role-btn flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold text-gray-500 hover:text-gray-900 hover:bg-gray-200/60">
                <i class="fa-solid fa-paintbrush"></i><span>UI Designer</span> <i class="fa-solid fa-lock text-[10px] opacity-40 ml-1"></i>
            </button>
            <button onclick="verifyAndSwitch('Software Developer')" id="btn-Developer" class="role-btn flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold text-gray-500 hover:text-gray-900 hover:bg-gray-200/60">
                <i class="fa-solid fa-code"></i><span>Software Developer</span> <i class="fa-solid fa-lock text-[10px] opacity-40 ml-1"></i>
            </button>
            <button onclick="verifyAndSwitch('Business Analyst')" id="btn-BA" class="role-btn flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold text-gray-500 hover:text-gray-900 hover:bg-gray-200/60">
                <i class="fa-solid fa-briefcase"></i><span>Business Analyst</span> <i class="fa-solid fa-lock text-[10px] opacity-40 ml-1"></i>
            </button>
        </div>
    </header>

    <!-- LOADER -->
    <div id="loader" class="flex-1 flex flex-col items-center justify-center space-y-4">
        <i class="fa-solid fa-circle-notch animate-spin text-3xl text-indigo-600"></i>
        <p class="text-sm font-semibold text-gray-600">Connecting to cloud storage backend...</p>
        <button onclick="useLocalFallback()" class="text-xs bg-white border border-gray-300 text-gray-600 px-3 py-1.5 rounded-lg shadow-sm hover:bg-gray-50 transition-all">
            Slow connection? Load offline backup layout
        </button>
    </div>

    <!-- MAIN INTERFACE PANEL -->
    <main id="dashboard-view" class="hidden flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="space-y-6 lg:col-span-1">
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest">Active Tracker Focus</label>
                    <span id="offline-badge" class="hidden text-[9px] bg-amber-100 text-amber-800 font-bold px-1.5 py-0.5 rounded">Offline Mode</span>
                </div>
                <select id="org-selector" onchange="selectOrganization(this.value)" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm font-bold text-gray-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></select>
            </div>

            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm space-y-4">
                <div>
                    <h4 id="panel-org-name" class="font-bold text-gray-900 text-base">---</h4>
                    <span id="panel-week-badge" class="inline-block mt-1 text-xs font-bold px-2 py-0.5 bg-gray-100 text-gray-600 rounded border border-gray-200">Week 1 Active</span>
                </div>
                <div class="space-y-1">
                  <div class="flex justify-between text-xs font-bold text-gray-500">
                    <span>Aggregate Completion Metrics</span>
                    <span id="panel-progress-text" class="text-gray-900">0%</span>
                  </div>
                  <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden border border-gray-200/20">
                    <div id="panel-progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                  </div>
                </div>
                <div class="grid grid-cols-4 gap-1 pt-2" id="timeline-indicator-blocks">
                    <div id="timeline-w1" class="py-2 rounded-lg text-[10px] font-bold text-center border">W1 Phase</div>
                    <div id="timeline-w2" class="py-2 rounded-lg text-[10px] font-bold text-center border">W2 Phase</div>
                    <div id="timeline-w3" class="py-2 rounded-lg text-[10px] font-bold text-center border">W3 Phase</div>
                    <div id="timeline-w4" class="py-2 rounded-lg text-[10px] font-bold text-center border">W4 Phase</div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 min-h-[350px]" id="workspace-viewport"></div>
        </div>
    </main>

    <script>
        // REPLACE WITH YOUR COPIED RENDER WEB SYSTEM LINK FROM PREVIOUS STEPS
        const API_BASE = 'https://membership-backend-w52h.onrender.com/api';

        const PINS = {
            'QA Specialist': 'qa123',
            'UI Designer': 'design123',
            'Software Developer': 'dev123',
            'Business Analyst': 'ba123'
        };

        let state = {
            organizations: [],
            selectedOrgId: '',
            currentRole: 'Stakeholder',
            isOffline: false
        };

        window.addEventListener('DOMContentLoaded', fetchOrganizations);

        async function fetchOrganizations() {
            try {
                const response = await fetch(`${API_BASE}/organizations`);
                const data = await response.json();
                state.isOffline = false;
                processIncomingData(data);
            } catch (err) {
                console.error("Using localized tracking parameters.", err);
                useLocalFallback();
            }
        }

        function useLocalFallback() {
            state.isOffline = true;
            document.getElementById('offline-badge').classList.remove('hidden');
            const fallbackData = [
                { id: '1', name: 'Metropolitan Museum of Art', website: 'https://www.metmuseum.org', contact: 'sarah.jenkins@metmuseum.org', logoReceived: 1, appleWalletStrip: 1, googleWalletStrip: 0, brandColor: '#E4002B', integrationType: 'Altru', integrationDone: 1, testingRecordsPassed: 0, cardsDelivered: 0, isLaunched: 0, currentWeek: 2 },
                { id: '2', name: 'Sciencenter Discovery Park', website: 'https://www.sciencenter.org', contact: 'm.ross@sciencenter.org', logoReceived: 0, appleWalletStrip: 0, googleWalletStrip: 0, brandColor: '#00A3E0', integrationType: 'RE NXT', integrationDone: 0, testingRecordsPassed: 0, cardsDelivered: 0, isLaunched: 0, currentWeek: 1 }
            ];
            processIncomingData(fallbackData);
        }

        function processIncomingData(data) {
            state.organizations = data.map(org => ({
                ...org,
                logoReceived: !!org.logoReceived,
                appleWalletStrip: !!org.appleWalletStrip,
                googleWalletStrip: !!org.googleWalletStrip,
                integrationDone: !!org.integrationDone,
                testingRecordsPassed: !!org.testingRecordsPassed,
                cardsDelivered: !!org.cardsDelivered,
                isLaunched: !!org.isLaunched,
            }));

            if (state.organizations.length > 0 && !state.selectedOrgId) {
                state.selectedOrgId = state.organizations[0].id;
            }
            
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            
            populateOrgSelector();
            renderDashboard();
        }

        async function createNewOrganization(name, website, contact) {
            if (!name) return alert("Organization Name is required!");
            
            const newOrg = {
                id: String(Date.now()),
                name: name,
                website: website || '',
                contact: contact || '',
                logoReceived: 0,
                appleWalletStrip: 0,
                googleWalletStrip: 0,
                brandColor: '#000000',
                integrationType: 'Altru',
                integrationDone: 0,
                testingRecordsPassed: 0,
                cardsDelivered: 0,
                isLaunched: 0,
                currentWeek: 1
            };

            // Optimistic front-end addition
            state.organizations.push({
                ...newOrg,
                logoReceived: false, appleWalletStrip: false, googleWalletStrip: false,
                integrationDone: false, testingRecordsPassed: false, cardsDelivered: false, isLaunched: false
            });
            state.selectedOrgId = newOrg.id;
            
            populateOrgSelector();
            renderDashboard();

            if (!state.isOffline) {
                try {
                    // Send to Render server backend using dynamic update trick
                    await fetch(`${API_BASE}/organizations/${newOrg.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newOrg),
                    });
                } catch (err) {
                    console.error("Failed writing new record to database server cloud:", err);
                }
            }
            alert(`${name} has been successfully added to the system portfolio pipeline!`);
        }

        async function pushUpdate(updatedFields) {
            const orgId = state.selectedOrgId;
            state.organizations = state.organizations.map(org => 
                org.id === orgId ? { ...org, ...updatedFields } : org
            );
            renderDashboard();

            if (!state.isOffline) {
                try {
                    await fetch(`${API_BASE}/organizations/${orgId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedFields),
                    });
                } catch (err) {
                    console.error("Local cache written, backend cloud failure:", err);
                }
            }
        }

        function verifyAndSwitch(targetRole) {
            const userPin = prompt(`Enter security Access Code PIN to switch into ${targetRole}:`);
            if (userPin === PINS[targetRole]) {
                switchRole(targetRole);
            } else {
                alert("Invalid security PIN. Access locked.");
            }
        }

        function populateOrgSelector() {
            const select = document.getElementById('org-selector');
            select.innerHTML = '';
            state.organizations.forEach(org => {
                const opt = document.createElement('option');
                opt.value = org.id;
                opt.textContent = org.name;
                opt.selected = org.id === state.selectedOrgId;
                select.appendChild(opt);
            });
        }

        function calculateProgress(org) {
            if (!org) return 0;
            const flags = [
                org.logoReceived, org.appleWalletStrip, org.googleWalletStrip,
                org.integrationDone, org.testingRecordsPassed, org.cardsDelivered, org.isLaunched
            ];
            return Math.round((flags.filter(Boolean).length / flags.length) * 100);
        }

        function selectOrganization(id) {
            state.selectedOrgId = id;
            renderDashboard();
        }

        function switchRole(role) {
            state.currentRole = role;
            const roleBtnMap = {
                'Stakeholder': 'btn-Stakeholder', 'QA Specialist': 'btn-QA',
                'UI Designer': 'btn-Designer', 'Software Developer': 'btn-Developer', 'Business Analyst': 'btn-BA'
            };

            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.className = "role-btn flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold text-gray-500 hover:text-gray-900 hover:bg-gray-200/60";
            });

            const activeBtn = document.getElementById(roleBtnMap[role]);
            if (activeBtn) {
                activeBtn.className = "role-btn flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-white text-indigo-700 shadow-sm border border-gray-200/50";
            }
            renderDashboard();
        }

        function renderDashboard() {
            const activeOrg = state.organizations.find(o => o.id === state.selectedOrgId);
            if (!activeOrg) return;

            document.getElementById('panel-org-name').textContent = activeOrg.name;
            document.getElementById('panel-week-badge').textContent = `Week ${activeOrg.currentWeek} Active`;
            
            const progress = calculateProgress(activeOrg);
            document.getElementById('panel-progress-text').textContent = `${progress}%`;
            document.getElementById('panel-progress-bar').style.width = `${progress}%`;

            for (let i = 1; i <= 4; i++) {
                const el = document.getElementById(`timeline-w${i}`);
                if (activeOrg.currentWeek === i) {
                    el.className = "py-2 rounded-lg text-[10px] font-bold text-center border bg-indigo-600 text-white border-indigo-600 shadow-sm";
                } else if (activeOrg.currentWeek > i) {
                    el.className = "py-2 rounded-lg text-[10px] font-bold text-center border bg-emerald-50 text-emerald-700 border-emerald-100";
                } else {
                    el.className = "py-2 rounded-lg text-[10px] font-bold text-center border bg-gray-50 text-gray-400 border-gray-100";
                }
            }

            const viewport = document.getElementById('workspace-viewport');
            viewport.innerHTML = '';

            if (state.currentRole === 'Stakeholder') {
                let rows = state.organizations.map(org => {
                    const pct = calculateProgress(org);
                    return `
                        <tr class="hover:bg-gray-50/70 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="font-semibold text-gray-900 text-sm">${org.name}</div>
                                <div class="text-xs text-gray-500">${org.contact || 'No contact configured'}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2.5 py-1 text-xs font-medium bg-indigo-50 text-indigo-700 rounded-md border border-indigo-100">${org.integrationType}</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-xs font-medium text-gray-600">Week ${org.currentWeek} of 4</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="flex items-center space-x-2">
                                    <div class="w-20 bg-gray-200 rounded-full h-1.5">
                                        <div class="bg-indigo-600 h-1.5 rounded-full" style="width: ${pct}%"></div>
                                    </div>
                                    <span class="text-xs font-bold text-gray-700">${pct}%</span>
                                </div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2.5 py-1 text-xs font-semibold rounded-md border ${org.isLaunched ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200'}">
                                    ${org.isLaunched ? 'Live Production' : 'Pipeline Build'}
                                </span>
                            </td>
                        </tr>`;
                }).join('');

                viewport.innerHTML = `
                    <div class="space-y-6">
                        <h2 class="text-base font-bold text-gray-800">Global Portfolio Tracker (Read Only)</h2>
                        <div class="overflow-x-auto rounded-xl border border-gray-200">
                            <table class="min-w-full divide-y divide-gray-200 text-left">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">Organization</th>
                                        <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">Integration Type</th>
                                        <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">Phase</th>
                                        <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">Metrics</th>
                                        <th class="px-6 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">Deployment</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-200 bg-white">${rows}</tbody>
                            </table>
                        </div>
                    </div>`;
            } 
            else if (state.currentRole === 'QA Specialist') {
                viewport.innerHTML = `
                    <div class="space-y-6">
                        <!-- SECTION A: INTRODUCE A NEW ACCOUNT -->
                        <div class="bg-purple-50/50 p-4 rounded-xl border border-purple-200/60 space-y-3">
                            <h4 class="text-xs font-bold text-purple-950 uppercase tracking-wider"><i class="fa-solid fa-plus-circle mr-1"></i> Register New Client Organization</h4>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <input type="text" id="new-org-name" placeholder="Museum Name (Required)" class="p-2 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-purple-500"/>
                                <input type="url" id="new-org-web" placeholder="Website URL" class="p-2 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-purple-500"/>
                                <input type="email" id="new-org-contact" placeholder="Main Contact Email" class="p-2 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-purple-500"/>
                            </div>
                            <button onclick="createNewOrganization(document.getElementById('new-org-name').value, document.getElementById('new-org-web').value, document.getElementById('new-org-contact').value)" class="bg-purple-700 hover:bg-purple-800 text-white text-xs font-bold px-4 py-2 rounded-lg shadow-sm transition-colors w-full md:w-auto">
                                Initialize Account Profile
                            </button>
                        </div>

                        <!-- SECTION B: EDIT CHOSEN ACCOUNT METADATA -->
                        <div class="space-y-4 pt-2">
                            <h3 class="text-base font-bold text-purple-900 border-b pb-3"><i class="fa-solid fa-database mr-2"></i>Modify Selected Profile Data</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Organization Name</label>
                                    <input type="text" value="${activeOrg.name}" onchange="pushUpdate({name: this.value})" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm"/>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Domain URL</label>
                                    <input type="url" value="${activeOrg.website || ''}" onchange="pushUpdate({website: this.value})" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm"/>
                                </div>
                                <div class="md:col-span-2">
                                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Primary Point of Contact (Email)</label>
                                    <input type="email" value="${activeOrg.contact || ''}" onchange="pushUpdate({contact: this.value})" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none text-sm"/>
                                </div>
                            </div>
                        </div>
                    </div>`;
            } 
            else if (state.currentRole === 'UI Designer') {
                viewport.innerHTML = `
                    <div class="space-y-5">
                        <h3 class="text-base font-bold text-pink-900 border-b pb-3"><i class="fa-solid fa-paintbrush mr-2"></i>Creative Identity Intake Workspace</h3>
                        <div class="space-y-3">
                            ${[
                                ['logoReceived', 'Official Vector Branding Logo Asset Checked'],
                                ['appleWalletStrip', 'Apple Wallet Pass Strip Art Verified (660x220)'],
                                ['googleWalletStrip', 'Google Wallet Hero Pass Asset Validated']
                            ].map(([field, label]) => `
                                <label class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border border-gray-200 cursor-pointer hover:bg-gray-100/70 transition-colors">
                                    <input type="checkbox" ${activeOrg[field] ? 'checked' : ''} onchange="pushUpdate({${field}: this.checked})" class="h-4 w-4 text-pink-600 border-gray-300 rounded focus:ring-pink-500"/>
                                    <span class="text-sm text-gray-700 font-medium">${label}</span>
                                </label>`).join('')}
                        </div>
                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Core Identity Brand Color</label>
                            <div class="flex items-center space-x-3">
                                <input type="color" value="${activeOrg.brandColor || '#000000'}" onchange="pushUpdate({brandColor: this.value})" class="w-12 h-10 border border-gray-300 rounded-lg cursor-pointer"/>
                                <input type="text" value="${activeOrg.brandColor || ''}" onchange="pushUpdate({brandColor: this.value})" class="p-2 border border-gray-300 rounded-lg text-sm font-mono w-32 uppercase text-center bg-white"/>
                            </div>
                        </div>
                    </div>`;
            } 
            else if (state.currentRole === 'Software Developer') {
                viewport.innerHTML = `
                    <div class="space-y-5">
                        <h3 class="text-base font-bold text-blue-900 border-b pb-3"><i class="fa-solid fa-code mr-2"></i>Integration Framework & System Operations</h3>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Target CRM Architecture</label>
                            <select onchange="pushUpdate({integrationType: this.value})" class="w-full p-2.5 border border-gray-300 rounded-lg bg-white text-sm font-medium text-gray-800">
                                <option value="Altru" ${activeOrg.integrationType === 'Altru' ? 'selected' : ''}>Blackbaud Altru Ecosystem</option>
                                <option value="Raiser Edge" ${activeOrg.integrationType === 'Raiser Edge' ? 'selected' : ''}>Raiser's Edge Classic</option>
                                <option value="RE NXT" ${activeOrg.integrationType === 'RE NXT' ? 'selected' : ''}>Blackbaud RE NXT Cloud API</option>
                                <option value="Versai" ${activeOrg.integrationType === 'Versai' ? 'selected' : ''}>Versai Museum Management Engine</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
                            <label class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border border-gray-200 cursor-pointer hover:bg-gray-100/70">
                                <input type="checkbox" ${activeOrg.integrationDone ? 'checked' : ''} onchange="pushUpdate({integrationDone: this.checked})" class="h-4 w-4 text-blue-600 rounded"/>
                                <span class="text-sm font-medium text-gray-700">API Connection Handshake Completed</span>
                            </label>
                            <label class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border border-gray-200/70 cursor-pointer hover:bg-gray-100/70">
                                <input type="checkbox" ${activeOrg.testingRecordsPassed ? 'checked' : ''} onchange="pushUpdate({testingRecordsPassed: this.checked})" class="h-4 w-4 text-blue-600 rounded"/>
                                <span class="text-sm font-medium text-gray-700">Data Ingestion Testing Batches Confirmed</span>
                            </label>
                        </div>
                    </div>`;
            } 
            else if (state.currentRole === 'Business Analyst') {
                viewport.innerHTML = `
                    <div class="space-y-5">
                        <h3 class="text-base font-bold text-emerald-900 border-b pb-3"><i class="fa-solid fa-briefcase mr-2"></i>Business Analyst Workspace</h3>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Onboarding Implementation Track Progress</label>
                            <select onchange="pushUpdate({currentWeek: parseInt(this.value)})" class="w-full p-2.5 border border-gray-300 rounded-lg bg-white text-sm font-medium">
                                <option value="1" ${activeOrg.currentWeek === 1 ? 'selected' : ''}>Week 1: Initial Identity Configuration</option>
                                <option value="2" ${activeOrg.currentWeek === 2 ? 'selected' : ''}>Week 2: Backend Integration Buildout</option>
                                <option value="3" ${activeOrg.currentWeek === 3 ? 'selected' : ''}>Week 3: Validation & Sandbox Diagnostics</option>
                                <option value="4" ${activeOrg.currentWeek === 4 ? 'selected' : ''}>Week 4: Final Certification & Deployment</option>
                            </select>
                        </div>
                        <div class="space-y-3 pt-2">
                            <label class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border border-gray-200 cursor-pointer">
                                <input type="checkbox" ${activeOrg.cardsDelivered ? 'checked' : ''} onchange="pushUpdate({cardsDelivered: this.checked})" class="h-4 w-4 text-emerald-600 rounded"/>
                                <span class="text-sm font-medium text-gray-700">Digital Membership Pass Engine Transferred to Production</span>
                            </label>
                            <label class="flex items-center space-x-3 bg-emerald-50/50 p-3 rounded-lg border border-emerald-200 cursor-pointer">
                                <input type="checkbox" ${activeOrg.isLaunched ? 'checked' : ''} onchange="pushUpdate({isLaunched: this.checked})" class="h-4 w-4 text-emerald-600 rounded"/>
                                <span class="text-sm font-bold text-emerald-800">Declare Institution Operational Architecture Live/Launched</span>
                            </label>
                        </div>
                    </div>`;
            }
        }
    </script>
</body>
